# Fragmentos para TAB 6 (plugins/TAB). Reemplaza las secciones equivalentes, no pegues el archivo entero.
# Insignias: prefijo de LuckPerms = rango, sufijo = team (ver salida/comandos-luckperms.txt).

# ---------- groups.yml: lista de TAB y nombre sobre la cabeza ----------
_DEFAULT_:
  tabprefix: "%luckperms_prefix%"
  customtabname: "&f%player%"
  tabsuffix: "%luckperms_suffix%"
  tagprefix: "%luckperms_prefix%"
  tagsuffix: "%luckperms_suffix%"

# ---------- config.yml: encabezado y pie de la lista (tecla Tab) ----------
header-footer:
  enabled: true
  header:
    - ""
    - "&l<#3fd0ff>UPCSMP</#4c6ef5>"
    - "&7Bienvenido, &f%player%"
    - "&8▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
  footer:
    - "&8▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
    - " &a%online% &7en línea    &7%ping%ms"
    - "<#ffc83d>aldeaocultaupc.holy.gg</#ff922b>"
    - ""

# ---------- config.yml: scoreboard ----------
scoreboard:
  enabled: true
  toggle-command: /sb
  remember-toggle-choice: true
  scoreboards:
    principal:
      # Los \uEB0x son los iconos del pack (EB00 jugador, EB01 team, EB02 rango, EB03 espada,
      # EB04 calavera, EB05 reloj, EB06 online, EB07 ping). Solo funcionan entre comillas dobles.
      title: "&l<#3fd0ff>UPCSMP</#4c6ef5>"
      lines:
        - "&8%date%"
        - "&8▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
        - " &f%player%"
        - " %luckperms_prefix%"
        - " %condition:tiene_team%"
        - ""
        - "&#7c8a9e&lESTADÍSTICAS"
        - " &7Asesinatos &a%statistic_player_kills%"
        - " &7Muertes &c%statistic_deaths%"
        - " &7Tiempo &b%statistic_hours_played%h"
        - ""
        - " &a%online% &7en línea   &7%ping%ms"
        - "&8▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬"
        - "<#ffc83d>aldeaocultaupc.holy.gg</#ff922b>"

# Va en config.yml SIN sangria (al nivel de scoreboard:). Si ya existe un "conditions:",
# agrega solo tiene_team dentro del que ya tienes: dos "conditions:" rompen el archivo.
conditions:
  tiene_team:
    conditions:
      - "%luckperms_suffix%!="
    true: "%luckperms_suffix%"
    false: "&8Sin team"
